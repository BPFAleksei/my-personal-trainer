<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Guía Inteligente de Gym</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main class="app-container">
        <h1>🏋️‍♂️ Mi Entrenador Digital</h1>
        <p>Filtra por músculo o por equipo para decidir tu rutina al instante</p>

    <div class="section-title">🎯 ¿Qué vas a entrenar hoy? (Músculo)</div>
    <div class="filter-group" id="filtro-musculo">
        <button class="btn-filter btn-todos active" onclick="filtrar('todos', 'musculo', this)">Todos</button>
        <button class="btn-filter" onclick="filtrar('hombro', 'musculo', this)">Hombro</button>
        <button class="btn-filter" onclick="filtrar('pierna', 'musculo', this)">Pierna</button>
        <button class="btn-filter" onclick="filtrar('espalda', 'musculo', this)">Espalda</button>
        <button class="btn-filter" onclick="filtrar('pecho', 'musculo', this)">Pecho</button>
        <button class="btn-filter" onclick="filtrar('triceps', 'musculo', this)">Tríceps</button>
    </div>

    <div class="section-title">🛠️ ¿Qué equipo tienes libre? (Máquina)</div>
    <div class="filter-group" id="filtro-equipo">
        <button class="btn-filter btn-todos active" onclick="filtrar('todos', 'equipo', this)">Todos</button>
        <button class="btn-filter btn-featured" onclick="filtrar('multiplane', 'equipo', this)"><span class="featured-icon" aria-hidden="true">⭐</span> MULTI-PLANE LIFT</button>
        <button class="btn-filter" onclick="filtrar('freemotion-triceps', 'equipo', this)">FreeMotion Tríceps</button>
        <button class="btn-filter" onclick="filtrar('multiplane-chest', 'equipo', this)">Multiplane Chest</button>
    </div>

    <div class="section-title" id="resultados-titulo">Ejercicios Disponibles</div>

    <div class="ejercicios-grid" id="ejercicios-grid"><!-- tarjetas renderizadas dinámicamente desde data/exercises.json -->

    </div>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
